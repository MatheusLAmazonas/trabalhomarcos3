name: CI/CD - Cadastro Pessoa Fisica

on:
  push:
    branches: ["main"]

jobs:
  test:
    name: Testes Unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rodar suíte de testes
        run: node --test

  build-and-push:
    name: Build e Push da Imagem Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cadastro-pessoa-fisica:latest

  deploy:
    name: Deploy na Nuvem
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH na VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cadastro-pessoa-fisica:latest
            docker stop cadastro-app || true
            docker rm cadastro-app || true
            docker run -d --name cadastro-app -p 80:80               --restart unless-stopped               ${{ secrets.DOCKERHUB_USERNAME }}/cadastro-pessoa-fisica:latest
